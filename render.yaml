# The hosted judge link, on Render's free web service.
#
# The plan we landed on: no Azure subscription exists on the student account, so the
# container goes where a card is not required. Render's free web service takes this
# repo, builds the Dockerfile already in it, and exposes the overlay on a public
# onrender.com URL. The container already binds 0.0.0.0:$PORT, which Render supplies,
# so nothing in the image had to change.
#
# The one trade-off, stated plainly: the free instance sleeps after 15 minutes
# without traffic, and the first visitor after a sleep waits about a minute. Judges
# clicking the link should be told that, or a keep-alive ping can be added later.
#
# Deploy by linking the repo in the Render dashboard ("New +" -> "Blueprint"),
# or visit https://render.com/deploy?repo=<this repo's URL>.

services:
  - type: web
    name: pitchframe
    runtime: docker
    plan: free
    # The readiness probe the harness and the docs already agree on.
    healthCheckPath: /api/health
    # Every push to the default branch rebuilds and redeploys the live URL.
    autoDeploy: true
    # Region nearest the judges; free instances run on shared hardware.
    region: oregon
