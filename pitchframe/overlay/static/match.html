<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pitchframe — verified match feed</title>
<link rel="alternate" href="/" title="Mode browser">
<meta name="description" content="A live football feed in which every published line is a claim that was checked against the event stream, with the measurement shown beside it.">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23070A0F'/%3E%3Ccircle cx='16' cy='16' r='7.5' fill='none' stroke='%232FD08A' stroke-width='2.5'/%3E%3C/svg%3E">

<!-- Fonts load without blocking paint. With no network the page keeps its condensed
     and monospace system faces and never waits on a font request. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&family=Archivo:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<noscript>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&family=Archivo:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
</noscript>
<link rel="stylesheet" href="/static/styles.css">
<script>
<body data-view="fan">
<a class="skip" href="#feed">Skip to commentary</a>

<!-- The sea behind the page. Inert and decorative, in its own module so that a browser
     without WebGL2 — or a WebGL failure of any kind — cannot take the replay down with
     it. See slats.js for the effect and styles.css for why it has a colour of its own. -->
<div class="slats" id="slats" data-slats aria-hidden="true"></div>

<div class="wrap">

  <!-- ---------------------------------------------------------------- masthead -->
  <header class="masthead">
    <div class="brand">
      <span class="brand__mark" aria-hidden="true">PF</span>
      <!-- The wordmark is the page's own word; masthead.js only asks the face for a
           weight under the pointer (static/text-pressure.js). Without that script this
           is a span with a name in it, which is what it is with it too. -->
      <span class="brand__name" data-wordmark>Pitchframe</span>
      <span class="brand__tag">Every line checked</span>
    </div>

    <div class="masthead__side">
      <p class="provider" id="provider" title="Which model tier produced the wording">
        <span class="provider__beacon" aria-hidden="true"></span>
        <span id="provider-text">connecting…</span>
      </p>
      <!-- The way back to the catalogue, and the one control for it. This page is one
           match; the front door is how a reader chooses which one, and it leads here for
           every card on it. The links are the page's, with their own addresses and the
           current one marked; masthead.js draws the pill over them (static/gooey-nav.js)
           and leaves the navigation to the anchors. -->
      <nav class="site-nav" data-site-nav aria-label="Site">
        <ul class="site-nav__list" data-nav-list>
          <li><a href="/">Catalogue</a></li>
          <li><a href="/match" aria-current="page">The feed</a></li>
        </ul>
      </nav>
      <!-- RubberSegment, filled by app.js. It used to be two pressed buttons; the control
           is now the component's, and the page still only supplies the words. -->
      <div class="seg seg--view" id="view-seg" data-segment="view" role="group" aria-label="Choose a view"></div>
    </div>
  </header>

  <!-- -------------------------------------------------------------- the title -->
  <!-- The page's own `<h1>`, and the one line the payload supplies: the match's name,
       written the way the board writes it, once the replay has arrived. It is a pressure
       host (static/text-pressure.js) mounted by app.js, so the first line a shared link
       opens on answers the pointer. Before the replay arrives — or if it never does — it
       says what the page is rather than guessing a match, which is the same rule the
       board's two names follow. -->
  <h1 class="title" id="match-title">Verified match feed</h1>

  <!-- --------------------------------------------------------------- match bar -->
  <!-- `data-glow` marks a panel whose boundary lights up where the pointer is near it, and
       every panel on this page carries it: this bar, the ratings, the feed, the check, the
       ledger and the two rail panels. It is one attribute rather than a class because the
       port is what adds the layers and the class, and a panel that lost the marker would
       keep its border and quietly stop lighting it. app.js reads the attribute. -->
  <section class="board" aria-label="Match" data-glow>
    <div class="board__turf" aria-hidden="true"></div>

    <div class="board__score">
      <p class="board__team board__team--home"><span class="board__name" id="team-home">Home</span></p>
      <p class="board__goals" id="score" aria-label="Score">0<i>–</i>0</p>
      <p class="board__team board__team--away"><span class="board__name" id="team-away">Away</span></p>
    </div>

    <div class="board__meta">
      <div class="clock">
        <span class="clock__minute" id="clock">0<i>′</i></span>
        <span class="clock__state" id="clock-state">paused</span>
      </div>

      <div class="share" role="img" id="share" aria-label="Possession share">
        <span class="share__bar" id="share-bar"></span>
      </div>
      <p class="share__legend">
        <span>Home <b id="share-home-pct">–</b></span>
        <span class="share__def">share of completed passes</span>
        <span><b id="share-away-pct">–</b> Away</span>
      </p>

      <div class="transport">
        <button type="button" class="transport__play" id="play" aria-label="Play the replay">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5 13 8 4 13.5z"/></svg>
        </button>
        <div class="seg seg--speed" id="speed-seg" data-segment="speed" role="group" aria-label="Replay speed"></div>
        <!-- The seek is a port (static/wake-slider.js): a track of bars that lifts into a
             wake around the handle, snapped to the minute. It carries its own name and its
             own value on the handle, so there is no label element here and no range input
             to keep in step with it. -->
        <div class="transport__seek" id="seek" data-wake="seek"></div>
        <p class="transport__note" id="rate-note">1 second = 1 match minute</p>
      </div>
    </div>

    <!-- The build-up launcher. The panel it opens is a modal at the foot of this page, and
         this is the control that opens it: a port of the React Bits SlingButton, which is
         pulled rather than pressed. It is always here, and it says what it is waiting for
         while there is nothing to show — the panel could not be reached at all before the
         replay had scored, which read as a control that did not work. -->
    <div class="launch" id="launch">
      <div class="launch__pad" id="sling" data-sling="build-up"></div>
      <p class="launch__copy">
        <span class="launch__label" id="launch-title">Goal build-up</span>
        <span class="launch__note" id="launch-note">Loading the replay…</span>
      </p>
    </div>
  </section>

  <!-- ----------------------------------------------------------------- ratings -->
  <!-- The squad's marks, live as everything else here is, with the man of the match and the
       paragraph about them arriving at full time. It sits in the page's own column rather
       than in the analyst rail, because the fan view hides the rail — and a panel whose
       whole subject is who played well is the last one that should be behind a view switch. -->
  <section class="ratings" aria-label="Player ratings" data-glow>
    <h2 class="eyebrow">
      <span>Ratings</span>
      <span class="ratings__window" id="ratings-window"></span>
    </h2>
    <p class="ratings__labels" id="ratings-labels"></p>
    <ol class="ratings__list" id="ratings-list"></ol>
    <p class="ratings__empty" id="ratings-empty">No analysed window yet.</p>

    <div class="award" id="award" hidden>
      <p class="award__tag">Man of the match</p>
      <p class="award__who">
        <span id="award-name">—</span>
        <span class="award__mark" id="award-rating">—</span>
      </p>
      <p class="award__reasons" id="award-reasons"></p>
      <p class="award__text" id="award-text"></p>
    </div>

    <p class="ratings__note">
      Marks are computed from this match's own event stream with fixed weights, and every one
      of them travels with the tallies behind it. The man of the match is named at full time,
      because that is when a match is over.
    </p>
  </section>

  <!-- ---------------------------------------------------------------- the grid -->
  <main class="grid">

    <!-- ------------------------------------------------------------- the feed -->
    <section class="feed" id="feed" aria-label="Commentary" data-glow>
      <header class="feed__head">
        <h2 class="feed__title">Commentary</h2>
        <p class="feed__note" id="feed-note">
          Published lines only, newest last.
        </p>
      </header>

      <!-- Fan view keeps one honest line about what is happening underneath, and a
           way to look at it. A viewer should not have to guess that a check ran. -->
      <p class="promo" id="promo">
        <span id="promo-text">Waiting for the first window.</span>
        <button type="button" class="promo__btn" id="promo-btn">See the receipts</button>
      </p>

      <!-- Not a live region: during playback a row lands every few seconds and
           announcing each one would flood a screen reader. The check panel above
           is the live region instead, because it carries the one thing worth
           interrupting for. -->
      <ol class="feed__list" id="feed-list"></ol>

      <p class="feed__empty" id="feed-empty">
        The feed opens with the first analysed window, because a claim is a comparison
        and the opening minutes have nothing to compare against. Press play, or drag
        the timeline to a minute.
      </p>
    </section>

    <!-- The right-hand column. Source order puts the check first so that on a narrow
         screen, where the column stacks, the verification leads the page. -->
    <div class="side">

    <!-- Pinned as one column: the claim being checked, the running tallies, and the rail
         under them. The check and the ledger are what an analyst wants in view while the
         commentary scrolls — and the rail has to be inside the pin rather than after it.
         A sticky column only ever covers what follows it in the same column: the metrics
         and the line-ups used to come after the pin, so as the page scrolled they slid up
         underneath the check panel and the ledger and could not be read at all. Held inside
         a pin bounded by the viewport, they are on screen from the start and scroll inside
         the column when the column is taller than the window. -->
    <div class="side__pin">

    <!-- ------------------------------------------------ the signature: the check -->
    <section class="check" id="check" data-state="idle" aria-label="Claim being checked" data-glow>
      <p class="eyebrow">
        <span id="check-window">No window analysed yet</span>
        <span class="chip" id="check-chip" hidden></span>
      </p>

      <blockquote class="check__saying" id="check-saying">
        The most recent claim appears here with the two measurements that decide it —
        what the claim said, and what the event stream says.
      </blockquote>

      <dl class="figures" id="check-figures" hidden>
        <div class="figures__row"><dt>claimed</dt><dd id="fig-claimed">–</dd></div>
        <div class="figures__row"><dt>measured</dt><dd id="fig-measured">–</dd></div>
      </dl>

      <p class="check__stamp" id="check-stamp" hidden></p>
      <p class="check__why" id="check-why" hidden></p>
      <p class="check__foot">Decided by arithmetic, never by a language model.</p>
    </section>

      <section class="ledger" aria-label="Verification ledger" data-glow>
        <h2 class="eyebrow">Ledger</h2>
        <dl class="ledger__grid">
          <div class="ledger__cell ledger__cell--verify"><dt>Published</dt><dd id="led-verified">0</dd></div>
          <div class="ledger__cell ledger__cell--flag"><dt>Caught</dt><dd id="led-rejected">0</dd></div>
          <div class="ledger__cell"><dt>Corrected</dt><dd id="led-corrections">0</dd></div>
          <div class="ledger__cell"><dt>Dropped</dt><dd id="led-dropped">0</dd></div>
        </dl>
        <p class="ledger__note" id="ledger-note">
          Caught counts claims the measurement contradicted.
        </p>
      </section>

    <!-- ------------------------------------------------------------- the rail -->
    <!-- Inside the pin, because a pinned column covers whatever follows it: see the note
         on the pin above. -->
    <aside class="rail" aria-label="Analysis">

      <section class="metrics" aria-label="Metric readings" data-glow>
        <h2 class="eyebrow">
          <span>Metrics</span>
          <span class="metrics__window" id="metrics-window"></span>
        </h2>
        <table class="metrics__table">
          <thead>
            <tr>
              <th scope="col">metric</th>
              <th scope="col">baseline</th>
              <th scope="col">window</th>
              <th scope="col"><span class="skip">change</span>Δ</th>
            </tr>
          </thead>
          <tbody id="metrics-body"></tbody>
        </table>
        <p class="metrics__empty" id="metrics-empty">No closed window yet.</p>
      </section>

      <section class="squads" aria-label="Line-ups" data-glow>
        <h2 class="eyebrow">Line-ups</h2>
        <div class="squads__cols" id="squads"></div>
        <p class="squads__note">
          Invented squads. No real club, player or competition appears anywhere in this
          project.
        </p>
      </section>
    </aside>
    </div>
    </div>
  </main>

  <!-- ------------------------------------------------------- goal build-up panel -->
  <!-- A native <dialog>, so the top layer, focus trapping and Escape-to-close are the
       platform's job rather than ours. The pitch inside is plain SVG drawn from the
       payload's own coordinates: no canvas, no map tiles, no library, no build step.
       It opens from a goal on the timeline and from nothing else. -->
  <dialog class="hl" id="hl" aria-labelledby="hl-title">
    <header class="hl__head">
      <div class="hl__id">
        <p class="eyebrow">Goal build-up</p>
        <p class="hl__title" id="hl-title">—</p>
      </div>
      <button type="button" class="hl__close" id="hl-close" aria-label="Close the build-up">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 3.5 12.5 12.5M12.5 3.5 3.5 12.5"/></svg>
      </button>
    </header>

    <!-- Which goal, when the match has more than one to choose from. Filled by app.js
         from the goals the replay has already reached, so the row cannot offer a goal
         the scoreboard has not scored yet; hidden entirely with one goal, because a
         choice of one is not a choice. -->
    <div class="hl__goals" id="hl-goals" role="group" aria-label="Goals in this match" hidden></div>

    <!-- Provenance, rendered straight from the payload's own labels. The page never
         composes these words itself: a view that could invent a label could drop one. -->
    <p class="hl__labels" id="hl-labels"></p>

    <div class="hl__stage">
      <svg class="hl__pitch" id="hl-svg" viewBox="0 0 105 68" role="img"
           aria-label="The path the ball took to the goal"></svg>
    </div>

    <div class="hl__bar">
      <p class="hl__step" id="hl-step">—</p>
      <div class="hl__controls">
        <button type="button" class="hl__btn" id="hl-replay">Replay</button>
        <div class="hl__speeds" role="group" aria-label="Build-up speed">
          <button type="button" class="hl__speed" data-hl-speed="0.5" aria-pressed="false">0.5×</button>
          <button type="button" class="hl__speed" data-hl-speed="1" aria-pressed="true">1×</button>
        </div>
      </div>
    </div>

    <dl class="hl__figures" id="hl-figures"></dl>
    <p class="hl__foot" id="hl-foot"></p>
  </dialog>

  <footer class="foot">
    <p>
      <span id="foot-match">—</span>
      <span class="foot__sep" aria-hidden="true">·</span>
      <span>generated from a seed, so this replay is identical on every machine</span>
    </p>
    <p class="foot__url" id="foot-url"></p>
  </footer>
</div>

<!-- The dock floats at the foot of the viewport. It is filled by app.js, and its rail is
     inert so that a fixed layer over the page cannot take a click that was meant for the
     page — the bar inside it is the only part that accepts them. It sits outside .wrap
     because it belongs to the viewport rather than to the page's column. -->
<div class="dockrail" id="dockrail" data-dock></div>

<!-- app.js is a module rather than a classic script because it imports the four ported
     controls — the segmented control, the dock, the seek, and the sling the build-up
     launcher is drawn on. A module is deferred, which is also what the wiring wants:
     every element it reaches for exists by the time it runs. -->
<script type="module" src="/static/app.js"></script>
<script type="module" src="/static/slats.js"></script>
<!-- The wordmark and the nav are the two things both documents share, so they are one
     module rather than a mounting call in each page's own entry point. -->
<script type="module" src="/static/masthead.js"></script>
</body>
</html>
